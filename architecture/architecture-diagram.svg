<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 740" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-obs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1180" height="740" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="24" y="20" width="1132" height="58" rx="10" fill="#0f172a"/>
  <text x="44" y="47" fill="#ffffff" font-size="18" font-weight="700">AWS Serverless CRM REST API — Cognito Auth, DynamoDB Streams, API Gateway Cache &amp; WAF</text>
  <text x="44" y="66" fill="#94a3b8" font-size="12">CloudFront Edge Delivery • Origin Access Control (OAC) • AWS X-Ray Distributed Tracing • Zero Server Management</text>

  <!-- AWS Cloud Boundary -->
  <rect x="230" y="96" width="926" height="620" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="248" y="118" fill="#334155" font-size="13" font-weight="700">AWS Cloud (Region: us-east-1) — Fully Serverless Architecture</text>

  <!-- Client Box -->
  <rect x="30" y="255" width="165" height="125" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="112" y="285" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">End Users</text>
  <text x="112" y="306" text-anchor="middle" fill="#475569" font-size="11">Web SPA &amp; REST Clients</text>
  <rect x="46" y="320" width="132" height="44" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="112" y="339" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="600">HTTPS + JWT Bearer</text>
  <text x="112" y="355" text-anchor="middle" fill="#3b82f6" font-size="10">X-Amzn-Trace-Id</text>

  <!-- Edge Security & CDN Zone -->
  <rect x="252" y="150" width="215" height="330" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="359" y="174" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">Global Edge &amp; Security</text>

  <!-- WAF Box -->
  <rect x="268" y="190" width="183" height="125" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="268" y="190" width="183" height="28" rx="8" fill="#dc2626"/>
  <text x="359" y="209" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">AWS WAFv2 Web ACL</text>
  <text x="278" y="236" fill="#1e293b" font-size="11">• Rate Limit (1000 / 5min IP)</text>
  <text x="278" y="254" fill="#1e293b" font-size="11">• Geo-Match Country Block</text>
  <text x="278" y="272" fill="#1e293b" font-size="11">• OWASP Common RuleSet</text>
  <text x="278" y="290" fill="#1e293b" font-size="11">• SQLi &amp; IP Reputation Rules</text>

  <!-- CloudFront Box -->
  <rect x="268" y="335" width="183" height="126" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <rect x="268" y="335" width="183" height="28" rx="8" fill="#7c3aed"/>
  <text x="359" y="354" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Amazon CloudFront</text>
  <text x="278" y="381" fill="#1e293b" font-size="11">• Redirect HTTP → HTTPS</text>
  <text x="278" y="399" fill="#1e293b" font-size="11">• / → S3 Origin (OAC SigV4)</text>
  <text x="278" y="417" fill="#1e293b" font-size="11">• /api/* → API GW Origin</text>
  <text x="278" y="435" fill="#1e293b" font-size="11">• Forwards Authorization JWT</text>

  <!-- S3 Frontend Origin -->
  <rect x="515" y="146" width="235" height="106" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="515" y="146" width="235" height="28" rx="10" fill="#16a34a"/>
  <text x="632" y="165" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Amazon S3 (Static SPA)</text>
  <text x="528" y="193" fill="#1e293b" font-size="11">• Private Bucket (Public Blocked)</text>
  <text x="528" y="211" fill="#1e293b" font-size="11">• CloudFront OAC Bucket Policy</text>
  <text x="528" y="229" fill="#1e293b" font-size="11">• HTML5/CSS3/ES6 CRM Portal</text>

  <!-- API Gateway REST API -->
  <rect x="515" y="280" width="235" height="175" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <rect x="515" y="280" width="235" height="28" rx="10" fill="#ea580c"/>
  <text x="632" y="299" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Amazon API Gateway (REST)</text>
  <text x="528" y="328" fill="#1e293b" font-size="11">• Cognito JWT Authorizer</text>
  <text x="528" y="346" fill="#1e293b" font-size="11">• Stage Response Cache (60s TTL)</text>
  <text x="528" y="364" fill="#1e293b" font-size="11">• Cache Key: path.id parameter</text>
  <text x="528" y="382" fill="#1e293b" font-size="11">• Usage Plan (50k req/mo, 100 rps)</text>
  <text x="528" y="400" fill="#1e293b" font-size="11">• Active X-Ray Tracing Enabled</text>
  <text x="528" y="418" fill="#64748b" font-size="10">GET/POST/PUT/DELETE /api/customers</text>
  <text x="528" y="434" fill="#64748b" font-size="10">GET /api/health  |  GET /api/audit</text>

  <!-- Amazon Cognito User Pool -->
  <rect x="515" y="485" width="235" height="122" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8"/>
  <rect x="515" y="485" width="235" height="28" rx="10" fill="#db2777"/>
  <text x="632" y="504" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Amazon Cognito User Pool</text>
  <text x="528" y="532" fill="#1e293b" font-size="11">• Sign-Up, Sign-In &amp; Hosted UI</text>
  <text x="528" y="550" fill="#1e293b" font-size="11">• Email Verification &amp; Password Policy</text>
  <text x="528" y="568" fill="#1e293b" font-size="11">• Issues RS256 OIDC ID Tokens</text>
  <text x="528" y="586" fill="#9d174d" font-size="11" font-weight="600">• Trigger: post_confirmation Lambda</text>

  <!-- Compute Tier (AWS Lambda) -->
  <rect x="800" y="146" width="334" height="196" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="967" y="170" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">Compute Tier — AWS Lambda (Python 3.12)</text>

  <rect x="816" y="184" width="302" height="64" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="828" y="205" fill="#92400e" font-size="12" font-weight="700">customers_api (CRUD Handler)</text>
  <text x="828" y="223" fill="#334155" font-size="11">Validates claims, enforces email uniqueness,</text>
  <text x="828" y="238" fill="#334155" font-size="11">queries GSIs, emits X-Ray subsegments.</text>

  <rect x="816" y="260" width="302" height="68" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="828" y="281" fill="#92400e" font-size="12" font-weight="700">stream_processor (Event Consumer)</text>
  <text x="828" y="299" fill="#334155" font-size="11">Consumes INSERT/MODIFY/REMOVE batches,</text>
  <text x="828" y="314" fill="#334155" font-size="11">writes audit diffs + SQS DLQ on failure.</text>

  <!-- Data Tier (DynamoDB + Streams + SNS) -->
  <rect x="800" y="366" width="334" height="241" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="967" y="390" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">Data &amp; Event Tier — Amazon DynamoDB</text>

  <rect x="816" y="405" width="302" height="82" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="828" y="425" fill="#1d4ed8" font-size="12" font-weight="700">Customers Table (PAY_PER_REQUEST)</text>
  <text x="828" y="443" fill="#334155" font-size="11">• PK: customerId | GSI1: EmailIndex</text>
  <text x="828" y="459" fill="#334155" font-size="11">• GSI2: TierStatusIndex (tier + createdAt)</text>
  <text x="828" y="475" fill="#0369a1" font-size="11" font-weight="600">• Streams: NEW_AND_OLD_IMAGES + PITR</text>

  <rect x="816" y="498" width="166" height="94" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="826" y="518" fill="#1d4ed8" font-size="12" font-weight="700">AuditLogs Table</text>
  <text x="826" y="536" fill="#334155" font-size="10">• PK: eventId, SK: time</text>
  <text x="826" y="552" fill="#334155" font-size="10">• GSI: CustomerAuditIndex</text>
  <text x="826" y="568" fill="#334155" font-size="10">• Auto-expire TTL (90d)</text>
  <text x="826" y="583" fill="#334155" font-size="10">• SSE Encryption</text>

  <rect x="992" y="498" width="126" height="94" rx="7" fill="#fef2f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="1055" y="520" text-anchor="middle" fill="#9f1239" font-size="11" font-weight="700">SNS + SQS DLQ</text>
  <text x="1055" y="542" text-anchor="middle" fill="#334155" font-size="10">Enterprise Alerts</text>
  <text x="1055" y="558" text-anchor="middle" fill="#334155" font-size="10">(SNS Topic)</text>
  <text x="1055" y="578" text-anchor="middle" fill="#334155" font-size="10">Stream DLQ (14d)</text>

  <!-- Observability Footer -->
  <rect x="252" y="630" width="882" height="68" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <text x="272" y="655" fill="#115e59" font-size="13" font-weight="700">Observability &amp; Governance Layer</text>
  <text x="272" y="677" fill="#334155" font-size="12">AWS X-Ray Active Distributed Tracing (API GW → Lambda → DynamoDB)  •  CloudWatch Logs &amp; Metric Dashboard  •  Alarms (Lambda Errors, API 5XX, WAF Blocks)</text>

  <!-- Connections -->
  <!-- Client to WAF/CloudFront -->
  <line x1="195" y1="305" x2="266" y2="255" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-sec)"/>
  <line x1="359" y1="315" x2="359" y2="333" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CloudFront to S3 & API GW -->
  <path d="M 451 370 L 485 370 L 485 198 L 513 198" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="451" y1="400" x2="513" y2="375" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API GW to Cognito -->
  <line x1="632" y1="455" x2="632" y2="483" stroke="#db2777" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="640" y="473" fill="#be185d" font-size="10" font-weight="600">Verify JWT</text>

  <!-- API GW to Lambda customers_api -->
  <path d="M 750 350 L 775 350 L 775 216 L 814 216" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- customers_api Lambda to DynamoDB Customers -->
  <path d="M 1118 216 L 1142 216 L 1142 442 L 1120 442" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-data)"/>

  <!-- DynamoDB Streams to stream_processor Lambda -->
  <path d="M 816 442 L 784 442 L 784 294 L 814 294" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="772" y="434" text-anchor="end" fill="#b45309" font-size="10" font-weight="600">Stream</text>

  <!-- stream_processor to AuditLogs + SNS/DLQ -->
  <line x1="898" y1="328" x2="898" y2="496" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-data)"/>
  <path d="M 1055 328 L 1055 496" fill="none" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Observability trace arrows -->
  <line x1="632" y1="607" x2="632" y2="628" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-obs)"/>
  <line x1="967" y1="607" x2="967" y2="628" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-obs)"/>
</svg>
